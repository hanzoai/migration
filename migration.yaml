# Hanzo V8 "Open Cloud" — migration & decommission chart (SINGLE SOURCE OF TRUTH).
#
# Target end-state: ONE unified Go binary (ghcr.io/hanzoai/cloud) that go:embeds
# the console2 SPA, every capability migrated to the FE (console2) or the BE
# (cloud), ALL-SQLite (no internal Postgres), collapsed to ONE Service / ONE
# origin, all live in production.
#
# Sourced from assessment wf_bcf82f7c-b54 (7-mapper CTO swarm). Snapshot: ~40% —
# the mechanism is real and the backend is live; the unification, the FE-route
# migration, and the Postgres shutdown are still ahead. LLM.md is the narrative;
# this file is the machine-readable matrix that runbooks + tooling read.

target:
  binary: ghcr.io/hanzoai/cloud                 # the one artifact
  embed: "webui.go //go:embed all:webui/dist"   # console2 SPA embedded, mounted LAST (API + /zap win)
  storage: sqlite-on-s3                          # SQLite files NATIVE on the S3-native object store
  origin: api.cloud.hanzo.ai                    # one origin serves SPA + /v1
  services: 1                                   # collapse the 2-Service estate (console2 SSR + cloud-api)
  rpc: zap-native                               # ZAP RPC plane (zapface / clients/rpc.go) as the native transport

# ── STORAGE ARCHITECTURE (confirmed): full SQLite, files native on S3 ─────────
# NOT local RWO PVC (the current single-writer model). Per-tenant SQLite .db
# files live on the S3-NATIVE optimized object store (hanzoai/s3 = SeaweedFS,
# deployed: s3 + s3-filer + s3-master) with WAL streaming replication via base's
# plugins/replicate + hanzoai/vfs (content-addressed, PQ-encrypted block store —
# HIP-0107 streaming replication). This is the console-sqlite.yaml pattern (Base
# app.db + SeaweedFS/replicate WAL, needs vfs 0.2.0) applied to EVERY service:
# durable + horizontally recoverable without Postgres, the .db is the source and
# S3 is the replicated backplane. ZAP-native inter-subsystem RPC (clients/rpc.go).
storage_architecture:
  primitive: "per-tenant SQLite (hanzoai/base)"
  backplane: "hanzoai/s3 (SeaweedFS: s3/s3-filer/s3-master) — S3-native optimized object store"
  replication: "base plugins/replicate WAL streaming + hanzoai/vfs (HIP-0107, PQ-encrypted content-addressed blocks)"
  rpc: "ZAP-native (zapface /zap + clients/rpc.go inter-subsystem transport)"
  status: todo
  note: "mechanism exists (vfs 360057d + base replicate + SeaweedFS live + console-sqlite.yaml precedent); wiring cloud/base off local PVC onto S3-backed vfs replication is the next major storage phase — staged per service, high blast, after the pg2sqlite cutover."

status:
  percent_complete: 40
  live: "api.cloud.hanzo.ai/v1/health -> {status: ok} (server: zip, SQLite-backed)"
  load_bearing_gaps:
    - id: embed-is-shell
      what: "webui/dist is a 3.5KB hand-written fallback, NOT the real console2 SPA"
      root: "console2 is Next SSR with 15 app/**/route.ts server handlers (KMS tokens); no output:export, no build:embed → Docker console stage ships the shell every build"
    - id: cloud-main-red
      what: "commit 9d47757 fails `CGO_ENABLED=0 go build ./cmd/cloud` (exit 1)"
      root: "no shippable image from tip; last green = embed commit 5600e6e; CR pinned pre-embed 1.785.24"
    - id: sqlite-not-executed
      what: "all-SQLite done at code level for cloud/iam/base, NOT executed in GitOps"
      root: "shared `sql` StatefulSet (PG18) + insights-sql + ~20 DATABASE_URL consumers still run; ZERO universe Jobs invoke the existing pg2sqlite tools"
    - id: contract-gaps
      what: "FE→BE route gaps (header mismatch RESOLVED)"
      root: >-
        RESOLVED: the X-IAM-* → canonical header sweep is done — org/project/env/
        user all read one convention (X-Org-Id/X-Project-Id/X-Environment/
        X-User-Id, no IAM prefix) across evalsvc + the ai monolith (~200 /v1
        routes) + CORS; FE drops the dead X-IAM-Org-Id. Zero X-IAM-* readers
        remain. STILL OPEN: 6 FE modules lack BE routes (rank 6); X-Environment
        has no storage dimension yet (rank 9); project/env not JWT-minted so a
